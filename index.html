<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fan Lu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
            background: #fff;
        }

        /* =========================
           NAVIGATION
        ========================== */

        nav {
            border-bottom: 1px solid #e5e5e5;
            background: #fff;
        }

        .nav-inner {
            width: 84%;
            max-width: 1250px;
            margin: 0 auto;
            padding: 22px 0;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .name {
            font-size: 22px;
            font-weight: 700;
            color: #222;
            text-decoration: none;
            white-space: nowrap;
        }

        nav .links {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        nav .links a {
            color: #444;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.2s ease;
            white-space: nowrap;
        }

        nav .links a:hover {
            color: #999;
        }

        /* =========================
           HERO
        ========================== */

        .hero {
            width: 84%;
            max-width: 1250px;
            margin: 0 auto;
            padding: 120px 0;
        }

        .hero h1 {
            font-size: 60px;
            margin: 0 0 15px;
        }

        .hero p {
            font-size: 22px;
            color: #666;
            margin: 0 0 30px;
        }

        /* =========================
           RESUME BUTTONS
        ========================== */

        .resume-buttons {
            display: flex;
            gap: 15px;
            justify-content: flex-start;
            margin-top: 28px;
        }

        .resume-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 130px;
            padding: 12px 24px;

            background-color: #222;
            color: white;
            text-decoration: none;

            border-radius: 6px;
            font-size: 16px;

            transition: background-color 0.2s ease;
        }

        .resume-button:hover {
            background-color: #555;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 760px) {

            .nav-inner {
                width: 88%;
                padding: 18px 0;

                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            nav .links {
                gap: 18px;
                flex-wrap: wrap;
            }

            nav .links a {
                font-size: 14px;
            }

            .hero {
                width: 88%;
                padding: 75px 0;
            }

            .hero h1 {
                font-size: 44px;
            }

            .hero p {
                font-size: 19px;
                line-height: 1.5;
            }

            .resume-buttons {
                flex-wrap: wrap;
            }
        }

    </style>
</head>


<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav>
        <div class="nav-inner">

            <a class="name" href="/">Fan Lu</a>

            <div class="links">
                <a href="/">Home</a>
                <a href="/Projects/">Projects</a>
                <a href="/Publications/">Publications</a>
                <a href="/technical_drawings/">Technical Drawings</a>
            </div>

        </div>
    </nav>


    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

        <h1>Hi, I'm Fan.</h1>

        <p>
            Ph.D. Candidate · Mechanical Engineering · University of Michigan
        </p>

        <div class="resume-buttons">

            <a
                class="resume-button"
                href="/Fan_Lu_Resume.pdf"
                target="_blank"
            >
                我的简历
            </a>

            <a
                class="resume-button"
                href="/Fan_Lu_Resume_08_2026.pdf"
                target="_blank"
            >
                My Resume
            </a>

        </div>

    </section>

</body>

</html>
