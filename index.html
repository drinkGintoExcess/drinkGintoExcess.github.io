<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fan Lu</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
        }

        /* Top navigation ribbon */
        nav {
            padding: 20px 8%;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .name {
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            color: #222;
        }

        nav a {
            margin-left: 30px;
            text-decoration: none;
            color: #222;
        }

        nav a:hover {
            color: #777;
        }

        /* Main section */
        .hero {
            padding: 120px 8%;
        }

        .hero h1 {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 22px;
            color: #666;
            margin-bottom: 30px;
        }

        /* Resume button */
        .resume-button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            transition: 0.2s;
        }

        .resume-button:hover {
            background-color: #555;
        }

    </style>
</head>


<body>

    <!-- Navigation -->
    <nav>

        <a class="name" href="/">Fan Lu</a>

        <div>
            <a href="/">Home</a>
            <a href="/Projects/">Projects</a>
            <a href="/Publications/">Publications</a>
            <a href="/cv/">CV</a>
        </div>

    </nav>


    <!-- Main section -->
    <section class="hero">

        <h1>Hi, I'm Fan.</h1>

        <p>
            Mechanical Engineer · Researcher · Designer
        </p>

        <a class="resume-button"
           href="/Fan_Lu_Resume.pdf"
           target="_blank">
            My Resume
        </a>

    </section>

</body>

</html>
